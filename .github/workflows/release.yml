name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish
        run: >
          dotnet publish SalesCalculator/SalesCalculator.csproj
          -c Release
          -r win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Copy config files
        run: |
          Copy-Item "SalesCalculator/table.json" "publish/table.json"
          Copy-Item "SalesCalculator/Positions.json" "publish/Positions.json"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/SalesCalculator.exe
            publish/table.json
            publish/Positions.json
          generate_release_notes: true